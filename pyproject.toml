[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-ai-portfolio"
version = "0.1.0"
description = "Reproducible machine learning, NLP, and applied AI projects."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Angelo Di Leo" }]
dependencies = [
    "accelerate",
    "bitsandbytes>=0.45",
    "datasets",
    "joblib>=1.4",
    "jupyterlab>=4.4",
    "llvmlite>=0.43",
    "matplotlib>=3.10",
    "numba>=0.60",
    "numpy>=2.2",
    "openai>=1.60",
    "pandas>=2.2",
    "peft>=0.13",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "shap>=0.52",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers",
    "trl>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ai_portfolio"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "projects/telco-churn/tests",
    "projects/cifar10-cnn/tests",
    "projects/bert-sentiment/tests",
    "projects/qwen-qlora/tests",
]
addopts = "-ra"
pythonpath = [
    "projects/telco-churn/src",
    "projects/cifar10-cnn/src",
    "projects/bert-sentiment/src",
    "projects/qwen-qlora/src",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
