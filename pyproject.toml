[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-ai-portfolio"
version = "0.1.0"
description = "Reproducible machine learning, NLP, and applied AI projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Angelo Di Leo" }]
dependencies = [
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ai_portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
