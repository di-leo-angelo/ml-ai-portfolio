# Example run config for llm-eval-harness (M0 scaffold).
#
# TOML is config, JSON/JSONL is data: this file is read-only input.
# The backends reference P1's actual setup: this is the P1 dogfood run
# (the local backend needs the GPU pod; see PLAN.md section 8).

name = "qwen-qlora-dogfood"
# P1's 230-row test split (gitignored; generated locally - see
# projects/qwen-qlora/data/split.json for the manifest and hashes).
data = "projects/qwen-qlora/data/test.jsonl"
temperature = 0.0
# 512 = P1's eval_run.py setting (max_new_tokens=512): the M6 acceptance
# bar is generation parity with P1's reported numbers, not a longer budget.
max_tokens = 512
output_dir = "projects/llm-eval-harness/reports/qwen-qlora"

# --- conditions under test ---------------------------------------------

[conditions.base]
seed = 0

[conditions.base.backend]
kind = "local"
model_id = "Qwen/Qwen3.8-27B"
dtype = "bfloat16"
load_in_4bit = true

[conditions.lora]
seed = 0

[conditions.lora.backend]
kind = "local"
model_id = "Qwen/Qwen3.8-27B"
adapter_path = "projects/qwen-qlora/artifacts"
dtype = "bfloat16"
load_in_4bit = true

# --- judge ---------------------------------------------------------------
# P1's judge: Qwen3-32B-AWQ via the RunPod public OpenAI-compatible
# endpoint (no deployment, no auth needed - set RUNPOD_API_KEY only if
# you point at a private serverless endpoint instead).

[judge]
dimensions = ["correctness", "tone", "format", "safety", "helpfulness"]
temperature = 0.0
max_tokens = 512

[judge.backend]
kind = "api"
base_url = "https://api.runpod.ai/v2/qwen3-32b-awq/openai/v1"
model = "qwen3-32b-awq"
api_key_env = "RUNPOD_API_KEY"

